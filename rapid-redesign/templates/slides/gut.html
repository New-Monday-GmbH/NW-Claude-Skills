<section id="gut" class="rv">
  <div class="wrap">
    <span class="kicker eyebrow-teal">{{kicker}}</span>
    <h2 class="sec-title">{{titel}}</h2>
    <div class="ch-row">
      <div class="gut-karten">
        {{#punkte}}<div class="gut-karte">
          <span class="gk-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
          <p>{{.}}</p>
        </div>
        {{/punkte}}
      </div>
      <div class="browser">
        <div class="bar"><i></i><i></i><i></i><span>{{browser.url}}</span></div>
        <img src="{{browser.bild}}" alt="{{browser.alt}}" style="height:auto">
      </div>
    </div>
  </div>
</section>
