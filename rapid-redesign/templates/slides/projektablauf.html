<section id="projektablauf" class="rv">
  <div class="wrap">
    <h2 class="sec-title">Projektablauf</h2>
    <span class="kicker eyebrow-teal pa-kicker">Geschätzter Zeitraum</span>
    <div class="pa">
      <div class="pa-heads">
        {{#phasen}}<div class="pa-head">{{phase}}</div>{{/phasen}}
      </div>
      <div class="pa-axis">
        <div class="pa-line"></div>
        {{#phasen}}<span class="pa-tick"></span>{{/phasen}}
        <svg class="pa-arrow" viewBox="0 0 16 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 7h12M8 2l5 5-5 5"/></svg>
      </div>
      <div class="pa-cols">
        {{#phasen}}<div class="pa-col">
          <div class="pa-col-head">{{phase}}</div>
          <div class="pa-woche">{{woche}}</div>
          <div class="pa-ziel">{{ziel}}</div>
          <ul class="pa-punkte">{{#punkte}}<li>{{.}}</li>{{/punkte}}</ul>
        </div>{{/phasen}}
      </div>
    </div>
  </div>
</section>
