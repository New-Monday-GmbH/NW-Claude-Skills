<section id="positionierung" class="rv">
  <div class="wrap">
    <span class="kicker eyebrow-teal">{{kicker}}</span>
    <h2 class="sec-title">{{titel}}</h2>
    <p class="claim">{{claim}}</p>
    <div class="pos-body">
      <div class="aspects">
        {{#aspekte}}<div class="aspect"><div class="num">{{@index2}}</div><h3>{{titel}}</h3><p>{{text}}</p></div>
        {{/aspekte}}
      </div>
      <img class="gfx pos-gfx" src="assets/gfx/aspekte.svg" alt="" aria-hidden="true">
    </div>
  </div>
</section>
